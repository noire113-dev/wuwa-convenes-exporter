<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>명조 튜닝 기록 내보내기</title>
  <link rel="stylesheet" href="vendor/element-plus.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app-root"></div>

  <template id="tpl-app">
    <div v-if="ready" class="relative">
      <div class="toolbar">
        <div class="btn-group">
          <el-button type="primary" plain :icon="hasData ? icons.RefreshRight : icons.Download" :loading="loading" @click="fetchData()">
            {{ hasData ? '기록 업데이트' : '튜닝 기록 불러오기' }}
          </el-button>
          <el-button type="success" plain :icon="icons.FolderOpened" :disabled="!hasData || loading" @click="exportExcel">엑셀 내보내기</el-button>
        </div>
        <div class="btn-group">
          <el-select v-if="accounts.length > 1 && !loading" class="w-44" :model-value="current" @change="switchAccount">
            <el-option v-for="uid in accounts" :key="uid" :label="'UID ' + uid" :value="uid"></el-option>
          </el-select>
          <el-dropdown @command="onCommand">
            <el-button plain type="info" :icon="icons.More">더보기</el-button>
            <template #dropdown>
              <el-dropdown-menu>
                <el-dropdown-item command="setting" :icon="icons.Setting">설정</el-dropdown-item>
                <el-dropdown-item command="url" :icon="icons.Link" :disabled="loading">URL로 가져오기</el-dropdown-item>
                <el-dropdown-item command="copyUrl" :icon="icons.DocumentCopy">URL 복사</el-dropdown-item>
                <el-dropdown-item command="dataDir" :icon="icons.Folder">데이터 폴더 열기</el-dropdown-item>
              </el-dropdown-menu>
            </template>
          </el-dropdown>
        </div>
      </div>

      <p class="status-line">{{ statusText }}</p>

      <div v-if="hasData" class="pool-grid">
        <div v-for="p in visiblePools" :key="p.type" class="pool-card">
          <p class="pool-title">{{ p.name }}</p>
          <pie-chart :stats="p.stats"></pie-chart>
          <pool-detail :stats="p.stats" :type="p.type"></pool-detail>
        </div>
      </div>
      <div v-else-if="!loading" class="empty">
        <p class="empty-title">아직 저장된 기록이 없습니다.</p>
        <p>1. 게임에서 <b>튜닝 → 기록</b> 화면을 한 번 엽니다.</p>
        <p>2. 왼쪽 위 <b>튜닝 기록 불러오기</b>를 누릅니다.</p>
        <p class="hint">게임 폴더: {{ config.gameDir || '찾지 못함 (설정에서 지정)' }}</p>
      </div>

      <setting-panel v-show="showSetting" :config="config" :current="current" :data-dir="dataDir"
        @close="showSetting = false" @changed="onConfigChanged" @imported="applyState"></setting-panel>

      <el-dialog v-model="showUrlDlg" title="URL로 가져오기" width="90%" class="max-w-md">
        <p class="dlg-hint">게임에서 튜닝 기록 화면을 연 뒤 얻은 URL(https://aki-gm-resources…)을 붙여 넣으세요.</p>
        <el-input v-model="urlInput" type="textarea" :autosize="{ minRows: 4, maxRows: 6 }" placeholder="https://aki-gm-resources-oversea.aki-game.net/aki/gacha/index.html#/record?..." spellcheck="false"></el-input>
        <template #footer>
          <el-button @click="showUrlDlg = false">취소</el-button>
          <el-button type="primary" @click="showUrlDlg = false; fetchData(urlInput)">확인</el-button>
        </template>
      </el-dialog>
    </div>
  </template>

  <template id="tpl-detail">
    <p class="text-gray-500 text-xs mb-2 text-center nowrap">
      <span class="mx-2" :title="stats.date[0]">{{ day(stats.date[0]) }}</span> -
      <span class="mx-2" :title="stats.date[1]">{{ day(stats.date[1]) }}</span>
    </p>
    <p class="text-gray-600 text-xs mb-1">
      <span class="mr-1">총 <span class="text-blue">{{ stats.total }}</span>회 뽑기</span>
      <span> · 5성 없이 <span class="mx-1 text-green">{{ stats.pity5 }}</span>회 누적</span>
    </p>
    <p class="text-gray-600 text-xs mb-1">
      <span class="mr-3 pre help text-yellow" :title="'공명자: ' + stats.count5c + '\n무기: ' + stats.count5w"><span class="min-w-10">5성: {{ stats.count5 }}</span> [{{ pct(stats.count5) }}]</span><br />
      <span class="mr-3 pre help text-purple" :title="'공명자: ' + stats.count4c + '\n무기: ' + stats.count4w"><span class="min-w-10">4성: {{ stats.count4 }}</span> [{{ pct(stats.count4) }}]</span><br />
      <span class="pre text-blue2"><span class="min-w-10">3성: {{ stats.count3 }}</span> [{{ pct(stats.count3) }}]</span>
    </p>
    <p v-if="stats.ssrPos.length" class="text-gray-600 text-xs mb-1">
      5성 기록:
      <span v-for="(s, i) in stats.ssrPos" :key="i" class="ssr help mr-1" :class="{ std: s.lost }"
        :style="s.lost ? null : { color: colorOf(s.name) }" :title="s.time + (s.lost ? '\n통상 5성 (반반 실패)' : '')">{{ s.name }}[{{ s.pity }}]</span>
    </p>
    <p v-if="stats.ssrPos.length" class="text-gray-600 text-xs">
      평균 5성 천장: <span class="text-green">{{ stats.avg5 }}</span>
      <template v-if="type === '1' && (stats.won + stats.lost)">
        · 반반 승률: <span class="text-green">{{ stats.won }}/{{ stats.won + stats.lost }}</span>
      </template>
    </p>
  </template>

  <template id="tpl-setting">
    <div class="setting-panel">
      <div class="setting-head">
        <h3 class="text-lg">설정</h3>
        <el-button :icon="icons.Close" circle plain @click="$emit('close')"></el-button>
      </div>
      <el-form label-width="130px">
        <el-form-item label="게임 폴더">
          <div class="flex-row">
            <el-input v-model="gameDir" placeholder="E:\Game\Wuthering Waves" @change="save({ gameDir })"></el-input>
            <el-button plain @click="pick">찾아보기</el-button>
            <el-button plain @click="detect">자동 찾기</el-button>
          </div>
          <p class="hint">런처 폴더(Wuthering Waves) 또는 그 안의 Wuthering Waves Game 폴더. 이 폴더의 게임 로그(Client.log, 암호화된 것도 해독)에서 튜닝 기록 URL을 찾습니다. 게임에서 튜닝 → 기록 화면을 연 직후에 업데이트하세요.</p>
        </el-form-item>
        <el-form-item label="데이터 백업">
          <div class="flex-row">
            <el-button plain type="primary" @click="importJson">JSON 가져오기</el-button>
            <el-button plain type="success" :disabled="!current" @click="exportJson">JSON 내보내기</el-button>
            <el-button plain @click="openDir">데이터 폴더 열기</el-button>
          </div>
          <p class="hint">가져온 JSON은 기존 기록과 합쳐집니다(기존 기록은 지우지 않음). 저장 위치: {{ dataDir }}</p>
        </el-form-item>
      </el-form>
      <h3 class="text-lg my-4">정보</h3>
      <p class="text-gray-600 text-xs mt-1">명조 튜닝 기록 내보내기 v3.8.0 · 기록은 이 PC에만 저장되며 외부로 보내지 않습니다.</p>
      <p class="text-gray-600 text-xs mt-1">게임 서버는 최근 기록만 보여 주므로, 주기적으로 업데이트하면 오래된 기록도 로컬에 계속 쌓입니다.</p>
    </div>
  </template>

  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/element-plus.js"></script>
  <script src="vendor/element-plus-ko.js"></script>
  <script src="vendor/element-plus-icons.js"></script>
  <script src="vendor/echarts.min.js"></script>
  <script src="../src/stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
