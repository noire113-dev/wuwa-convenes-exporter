<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>WuWa Convenes Exporter</title>
  <link rel="stylesheet" href="vendor/element-plus.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app-root"></div>

  <template id="tpl-app">
    <div class="relative">
      <div class="toolbar">
        <div class="btn-group">
          <el-button type="primary" plain :icon="hasData ? icons.RefreshRight : icons.Download" :loading="loading" @click="fetchData()">
            {{ hasData ? t('btn.update') : t('btn.load') }}
          </el-button>
          <el-button type="success" plain :icon="icons.FolderOpened" :disabled="!hasData || loading" @click="exportExcel">{{ t('btn.excel') }}</el-button>
        </div>
        <div class="btn-group">
          <el-select v-if="accounts.length > 1 && !loading" class="w-44" :model-value="current" @change="switchAccount">
            <el-option v-for="uid in accounts" :key="uid" :label="'UID ' + uid" :value="uid"></el-option>
          </el-select>
          <el-dropdown @command="onCommand">
            <el-button plain type="info" :icon="icons.More">{{ t('btn.more') }}</el-button>
            <template #dropdown>
              <el-dropdown-menu>
                <el-dropdown-item command="setting" :icon="icons.Setting">{{ t('menu.setting') }}</el-dropdown-item>
                <el-dropdown-item command="url" :icon="icons.Link" :disabled="loading">{{ t('menu.url') }}</el-dropdown-item>
                <el-dropdown-item command="copyUrl" :icon="icons.DocumentCopy">{{ t('menu.copyUrl') }}</el-dropdown-item>
                <el-dropdown-item command="dataDir" :icon="icons.Folder">{{ t('menu.dataDir') }}</el-dropdown-item>
              </el-dropdown-menu>
            </template>
          </el-dropdown>
        </div>
      </div>

      <p class="status-line">{{ statusText }}</p>

      <div v-if="hasData" class="pool-grid">
        <div v-for="p in visiblePools" :key="p.type" class="pool-card">
          <p class="pool-title">{{ p.name }}</p>
          <pie-chart :stats="p.stats"></pie-chart>
          <pool-detail :stats="p.stats" :type="p.type"></pool-detail>
        </div>
      </div>
      <div v-else-if="!loading" class="empty">
        <p class="empty-title">{{ t('empty.title') }}</p>
        <p>{{ t('empty.step1') }}</p>
        <p>{{ t('empty.step2') }}</p>
        <p class="hint">{{ t('empty.gameDir', { dir: config.gameDir || t('empty.notFound') }) }}</p>
      </div>

      <setting-panel v-show="showSetting" :config="config" :current="current" :data-dir="dataDir" :version="version"
        @close="showSetting = false" @changed="onConfigChanged" @imported="applyState"></setting-panel>

      <el-dialog v-model="showUrlDlg" :title="t('url.title')" width="90%" class="max-w-md">
        <p class="dlg-hint">{{ t('url.hint') }}</p>
        <el-input v-model="urlInput" type="textarea" :autosize="{ minRows: 4, maxRows: 6 }" placeholder="https://aki-gm-resources-oversea.aki-game.net/aki/gacha/index.html#/record?..." spellcheck="false"></el-input>
        <template #footer>
          <el-button @click="showUrlDlg = false">{{ t('common.cancel') }}</el-button>
          <el-button type="primary" @click="showUrlDlg = false; fetchData(urlInput)">{{ t('common.ok') }}</el-button>
        </template>
      </el-dialog>
    </div>
  </template>

  <template id="tpl-detail">
    <p class="text-gray-500 text-xs mb-2 text-center nowrap">
      <span class="mx-2" :title="stats.date[0]">{{ day(stats.date[0]) }}</span> -
      <span class="mx-2" :title="stats.date[1]">{{ day(stats.date[1]) }}</span>
    </p>
    <p class="text-gray-600 text-xs mb-1">
      <span class="mr-1">{{ t('detail.totalPre') }}<span class="text-blue">{{ stats.total }}</span>{{ t('detail.totalPost') }}</span>
      <span>{{ t('detail.pityPre') }}<span class="mx-1 text-green">{{ stats.pity5 }}</span>{{ t('detail.pityPost') }}</span>
    </p>
    <p class="text-gray-600 text-xs mb-1">
      <span class="mr-3 pre help text-yellow" :title="split(stats.count5c, stats.count5w)"><span class="min-w-10">{{ t('detail.star5') }}: {{ stats.count5 }}</span> [{{ pct(stats.count5) }}]</span><br />
      <span class="mr-3 pre help text-purple" :title="split(stats.count4c, stats.count4w)"><span class="min-w-10">{{ t('detail.star4') }}: {{ stats.count4 }}</span> [{{ pct(stats.count4) }}]</span><br />
      <span class="pre text-blue2"><span class="min-w-10">{{ t('detail.star3') }}: {{ stats.count3 }}</span> [{{ pct(stats.count3) }}]</span>
    </p>
    <p v-if="stats.ssrPos.length" class="text-gray-600 text-xs mb-1">
      {{ t('detail.history') }}:
      <span v-for="(s, i) in stats.ssrPos" :key="i" class="ssr help mr-1" :class="{ std: s.lost }"
        :style="s.lost ? null : { color: colorOf(s.name) }" :title="s.time + (s.lost ? '\n' + t('detail.stdTip') : '')">{{ s.name }}[{{ s.pity }}]</span>
    </p>
    <p v-if="stats.ssrPos.length" class="text-gray-600 text-xs">
      {{ t('detail.avg') }}: <span class="text-green">{{ stats.avg5 }}</span>
      <template v-if="type === '1' && (stats.won + stats.lost)">
        · {{ t('detail.winRate') }}: <span class="text-green">{{ stats.won }}/{{ stats.won + stats.lost }}</span>
      </template>
    </p>
  </template>

  <template id="tpl-setting">
    <div class="setting-panel">
      <div class="setting-head">
        <h3 class="text-lg">{{ t('setting.title') }}</h3>
        <el-button :icon="icons.Close" circle plain @click="$emit('close')"></el-button>
      </div>
      <el-form label-width="130px">
        <el-form-item :label="t('setting.language')">
          <el-select v-model="lang" class="w-44" @change="changeLang">
            <el-option v-for="l in langs" :key="l.value" :label="l.label" :value="l.value"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item :label="t('setting.gameDir')">
          <div class="flex-row">
            <el-input v-model="gameDir" placeholder="E:\Game\Wuthering Waves" @change="save({ gameDir })"></el-input>
            <el-button plain @click="pick">{{ t('setting.browse') }}</el-button>
            <el-button plain @click="detect">{{ t('setting.detect') }}</el-button>
          </div>
          <p class="hint">{{ t('setting.gameDirHint') }}</p>
        </el-form-item>
        <el-form-item :label="t('setting.backup')">
          <div class="flex-row">
            <el-button plain type="primary" @click="importJson">{{ t('setting.importJson') }}</el-button>
            <el-button plain type="success" :disabled="!current" @click="exportJson">{{ t('setting.exportJson') }}</el-button>
            <el-button plain @click="openDir">{{ t('setting.openDir') }}</el-button>
          </div>
          <p class="hint">{{ t('setting.backupHint', { dir: dataDir }) }}</p>
        </el-form-item>
      </el-form>
      <h3 class="text-lg my-4">{{ t('setting.about') }}</h3>
      <p class="text-gray-600 text-xs mt-1">{{ t('about.line1', { name: t('app.title'), ver: version }) }}</p>
      <p class="text-gray-600 text-xs mt-1">{{ t('about.line2') }}</p>
      <p class="text-gray-600 text-xs mt-1">{{ t('about.names') }}</p>
      <p class="text-gray-600 text-xs mt-1">GitHub: <a class="link" @click="openRepo">https://github.com/noire113-dev/wuwa-convenes-exporter</a></p>
    </div>
  </template>

  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/element-plus.js"></script>
  <script src="vendor/element-plus-ko.js"></script>
  <script src="vendor/element-plus-en.js"></script>
  <script src="vendor/element-plus-icons.js"></script>
  <script src="vendor/echarts.min.js"></script>
  <script src="../src/stats.js"></script>
  <script src="../src/i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
